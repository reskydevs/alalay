[package]
name = "device-driver"
version = "1.0.0"
edition = "2021"
description = "High-performance cross-agent mobile device navigation and calibration CLI tool"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
quick-xml = "0.37"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
